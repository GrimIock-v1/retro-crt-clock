[env:esp32dev]
platform = espressif32 @ 6.8.1
board = esp32dev
framework = arduino
monitor_speed = 115200

; Arduino-ESP32 2.0.17 is bundled by espressif32 6.8.1.
; Do not move this project to Arduino-ESP32 3.x without first porting/testing
; the low-level composite-video library.
lib_deps =
    tzapu/WiFiManager @ 2.0.17
    bblanchon/ArduinoJson @ 6.21.6
    https://github.com/marciot/ESP32CompositeColorVideo.git#24b75732dc2e1127fe9583cc9ff0f50c0a0d1cfa

build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=1
